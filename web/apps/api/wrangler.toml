name = "wyckoff-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Free Workers Logs: ~200k events/day, 3-day retention. No Supabase writes.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[vars]
ENVIRONMENT = "production"
# 自部署：LLM 用的是自己的 Key，80 次/天是上游共享服务的成本控制，这里放宽。
CHAT_DAILY_LIMIT_PER_USER = "1000"
CHAT_MIN_INTERVAL_MS = "2500"
# 自部署：off 时跳过星球会员校验（仍要求登录）；删掉或设为其他值恢复会员限制。
MEMBERSHIP_MODE = "off"
# 自建 sandbox bridge 上线并配好 SANDBOX_BRIDGE_URL/SECRET 后再改回 "true"。
AGENT_SANDBOX_ENABLED = "false"
AGENT_SANDBOX_TIMEOUT_MS = "60000"
AGENT_RUN_TTL_SECONDS = "3600"
AGENT_RUN_DAILY_LIMIT_PER_USER = "20"
AGENT_RUN_DAILY_CPU_LIMIT_MS = "120000"
AGENT_RUN_MIN_INTERVAL_MS = "10000"
# SANDBOX_BRIDGE_URL 指向自己的 bridge（必须 HTTPS），原值是作者的 Vercel 部署。
SANDBOX_BRIDGE_URL = ""
# Cron 触发 GitHub workflow 的目标仓库；Token 用 `wrangler secret put GITHUB_DISPATCH_TOKEN`。
GITHUB_DISPATCH_REPO = "Akariayumu/WyckoffTradingAgent"
GITHUB_DISPATCH_REF = "self-host"

# GitHub Actions 的 schedule 常晚好几个小时，由这里准点触发（UTC）。
# 新增表达式要同步登记到 src/services/scheduled-dispatch.ts 的 SCHEDULED_WORKFLOWS。
[triggers]
crons = ["17 9 * * SUN-THU"]

[[durable_objects.bindings]]
name = "AGENT_RUN_NOTIFIER"
class_name = "AgentRunNotifier"

# 手机遥控的信箱：手机与电脑各连一条 WS，由它按 connId 定向转发。
[[durable_objects.bindings]]
name = "REMOTE_RELAY"
class_name = "RemoteRelay"

# SQLite-backed classes are the only Durable Objects available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRunNotifier"]

# 新 class 要独立的 tag —— v1 已经部署过，改它会被 Cloudflare 拒绝。
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RemoteRelay"]

[[queues.producers]]
queue = "wyckoff-agent-runs"
binding = "AGENT_RUN_QUEUE"

[[queues.consumers]]
queue = "wyckoff-agent-runs"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "wyckoff-agent-runs-dlq"

[[queues.consumers]]
queue = "wyckoff-agent-runs-dlq"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
